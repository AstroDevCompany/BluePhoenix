<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BluePhoenix</title>
    <style>
      html, body, #root {
        margin: 0;
        height: 100%;
        background: #000;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot-splash img {
        height: 94vh;
        width: auto;
        max-width: 100vw;
        object-fit: contain;
      }
      #boot-splash[hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-label="BluePhoenix is loading">
      <img src="/logo.png" alt="BluePhoenix" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
