[package]
name = "bluephoenix"
version.workspace = true
edition.workspace = true
description = "BluePhoenix command center"
authors.workspace = true

[lib]
name = "bluephoenix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bluephoenix-domain.workspace = true
bluephoenix-sync-protocol.workspace = true
bluephoenix-ai = { workspace = true, features = ["local-llm"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-window-state = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
semver.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
hostname = "0.4"
open = "5"
which = "7"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
bluephoenix-ai = { workspace = true, features = ["local-llm", "cuda"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSGeometry"] }
bluephoenix-ai = { workspace = true, features = ["local-llm", "metal"] }
