[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "apps/api",
    "crates/domain",
    "crates/sync-protocol",
    "crates/ai",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["BluePhoenix"]

[workspace.dependencies]
bluephoenix-domain = { path = "crates/domain" }
bluephoenix-sync-protocol = { path = "crates/sync-protocol" }
bluephoenix-ai = { path = "crates/ai" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
semver = { version = "1", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
